# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'azorng/tmux-smooth-scroll'

set -g @plugin 'Subbeh/tmux-tpad'


set -g @plugin 'graemedavidson/tmux-pane-focus'

#yank
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# prefix highlight
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# notify
set -g @plugin 'rickstaa/tmux-notify'


set -g @plugin "soyuka/tmux-current-pane-hostname"

# menu
set -g @plugin 'jaclu/tmux-menus'

# Terminal type configuration
set -g default-terminal 'xterm-256color'
set -ga terminal-overrides ",xterm-256color:Tc"


# focus events enabled for terminals that support them
set -s focus-events on

set -g set-titles on          # set terminal title

set -g monitor-activity on
set -g visual-activity off

# replace C-b by M-Space instead of using both prefixes
set -gu prefix2
unbind C-a
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

set -g status-right-length 400

# set-window-option -g mode-style bg=black
set -g base-index 1 # 设置窗口的起始下标为1
set -g pane-base-index 1 # 设置面板的起始下标为1

set -g renumber-windows on    # renumber windows when a window is close

# setw -g automatic-rename off
# setw -g automatic-rename on   # rename window to reflect current program
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename on

unbind '"'
bind - splitw -v -c '#{pane_current_path}' # 垂直方向新增面板，默认进入当前目录
unbind %
bind | splitw -h -c '#{pane_current_path}' # 水平方向新增面板，默认进入当前目录

# enable mouse
set -g mouse on


bind -r e lastp # 选择最后一个面板
bind -r ^e last # 选择最后一个窗口

set -g @yank_action 'copy-pipe'


# prefix
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'


# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'

# tpad
set -g @tpad-scratchpad-bind   "C-p"
set -g @tpad-scratchpad-opts   "status on"
set -g @tpad-scratchpad-dir    "#{pane_current_path}"


# styling
#+----------------+
#+ Plugin Support +
#+----------------+
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_fg black
set -g @prefix_highlight_bg brightcyan

#+---------+
#+ Options +
#+---------+
set -g status-interval 1
set -g status on

#+--------+
#+ Status +
#+--------+
#+--- Layout ---+
set -g status-justify left

#+--- Colors ---+
set -g status-bg black
set -g status-fg white
set -g status-style none

#+-------+
#+ Panes +
#+-------+
set -g pane-border-style fg=black 
set -g pane-border-style bg=black
set -g pane-active-border-style bg=black
set -g pane-active-border-style fg=brightblack
set -g display-panes-colour black
set -g display-panes-active-colour brightblack

#+------------+
#+ Clock Mode +
#+------------+
setw -g clock-mode-colour cyan

#+----------+
#+ Messages +
#+---------+
set -g message-style fg=cyan
set -g message-style bg=brightblack
set -g message-command-style fg=cyan
set -g message-command-style bg=brightblack
#+--- tmux-prefix-highlight ---+
set -g @prefix_highlight_output_prefix "#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore]#[bg=brightcyan]#[fg=black]"
set -g @prefix_highlight_output_suffix "#[fg=brightcyan]#[bg=black]#[nobold]#[noitalics]#[nounderscore] "
set -g @prefix_highlight_copy_mode_attr "fg=brightcyan,bg=black,bold"

#+--------+
#+ Status +
#+--------+
#+--- Bars ---+
set -g status-left "#[fg=blue,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
set -g status-right "#{prefix_highlight}#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] %Y/%m/%d %H:%M #[fg=brightblack,bg=black] #[fg=cyan,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=cyan,bold] #H #[fg=cyan,bg=black,bold]"
set -g status-justify centre
#+--- Windows ---+
set -g window-status-format " #[fg=brightgreen,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=brightgreen]#I #[fg=white,bg=brightblack] #W #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format " #[fg=cyan,bg=black,nobold,noitalics,nounderscore]#[fg=black,bg=cyan]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #W #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
set -g window-status-activity-style none

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
